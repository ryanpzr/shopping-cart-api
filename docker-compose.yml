services:
  db:
    image: postgres:16
    container_name: database_sc
    restart: always
    # Debezium reads the outbox inserts from the WAL, which needs logical decoding.
    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_DB: shopping_cart
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d shopping_cart']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./
      target: api
    container_name: backend_sc
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: 12345
      DB_NAME: shopping_cart
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env and set it}
      # The audit history is read from MongoDB. Without the activity-log profile
      # there is no "mongo" host, and GET /admin/users/:id/activity answers 503
      # while the rest of the API works normally.
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: activity_log
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  # ── Activity log pipeline ────────────────────────────────────────────────────
  # Optional: docker compose --profile activity-log up --build
  # API -> outbox_events (Postgres) -> Debezium (WAL) -> Kafka -> consumer -> MongoDB

  kafka:
    profiles: [activity-log]
    image: apache/kafka:3.9.0
    container_name: kafka_sc
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    profiles: [activity-log]
    image: apache/kafka:3.9.0
    container_name: kafka_init_sc
    restart: 'no'
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic activity-log.events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic activity-log.events.dlq --partitions 1 --replication-factor 1

  connect:
    profiles: [activity-log]
    image: quay.io/debezium/connect:3.0.8.Final
    container_name: connect_sc
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: shopping-cart-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  # Registers (or updates) the Debezium connector; safe to run again.
  connector-init:
    profiles: [activity-log]
    image: curlimages/curl:8.11.1
    container_name: connector_init_sc
    restart: 'no'
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./deploy/debezium:/config:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        curl -sf -X PUT -H 'Content-Type: application/json' \
          --data @/config/outbox-connector.json \
          http://connect:8083/connectors/outbox-connector/config

  mongo:
    profiles: [activity-log]
    image: mongo:7
    container_name: mongo_sc
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  activity-consumer:
    profiles: [activity-log]
    build:
      context: ./
      target: consumer
    container_name: activity_consumer_sc
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: activity-log.events
      KAFKA_DLQ_TOPIC: activity-log.events.dlq
      KAFKA_GROUP: activity-log-writer
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: activity_log

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  mongo_data:
    driver: local
