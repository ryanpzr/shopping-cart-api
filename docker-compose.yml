services:
  db:
    image: postgres:16
    container_name: database_sc
    restart: always
    environment:
      POSTGRES_DB: shopping_cart
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d shopping_cart']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./
    container_name: backend_sc
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: 12345
      DB_NAME: shopping_cart
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env and set it}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
    driver: local
